name: Design review screenshots
on:
  pull_request:
    paths:
      - '.github/workflows/design-review.yml'
      - 'playwright.design-review.config.mjs'
      - 'tests/browser/*.design-review.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config=playwright.design-review.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vimdf-design-review
          path: test-results/design-review/
          if-no-files-found: error
          retention-days: 14
