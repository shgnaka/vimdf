name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:password
      - run: npm run test:scroll
      - run: npm run test:local-browser
      - run: npm run build
      - name: Include licenses
        run: |
          cp LICENSE dist/LICENSE
          cp node_modules/pdfjs-dist/LICENSE dist/LICENSE.pdfjs
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: vimdf-unpacked-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

